<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Scholars - Admin Panel</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #000;
            color: #fff;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #fff;
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .login-screen {
            max-width: 400px;
            margin: 100px auto;
            border: 1px solid #fff;
            padding: 40px;
        }

        .login-screen h2 {
            margin-bottom: 30px;
            font-weight: normal;
        }

        input, textarea, select {
            width: 100%;
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            margin-bottom: 15px;
        }

        button {
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .btn-add {
            margin-bottom: 30px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            border: 1px solid #fff;
            padding: 20px;
        }

        .product-card h3 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .product-card p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .product-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #000;
            border: 1px solid #fff;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            border: 1px solid #fff;
            padding: 20px;
        }

        .stat-card h3 {
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .stat-card p {
            font-size: 32px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 12px;
        }

        .image-upload-section {
            border: 1px solid #fff;
            padding: 20px;
            margin-bottom: 20px;
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border: 1px solid #fff;
        }

        .upload-btn {
            width: 100%;
            margin-bottom: 10px;
        }

        .cloudinary-setup {
            background: #1a1a1a;
            border: 1px solid #fff;
            padding: 20px;
            margin-bottom: 30px;
        }

        .cloudinary-setup.hidden {
            display: none;
        }

        .setup-input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <h2>ADMIN LOGIN</h2>
        <form id="loginForm">
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
            <div id="loginError" class="error"></div>
        </form>
        <p style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
            Default password: bluescholars2026<br>
            (Change this in the code!)
        </p>
    </div>

    <div id="adminPanel" style="display: none;">
        <div class="container">
            <header>
                <h1>BLUE SCHOLARS - ADMIN</h1>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </header>

            <div id="cloudinarySetup" class="cloudinary-setup">
                <h2 style="margin-bottom: 20px; font-size: 18px;">CLOUDINARY SETUP</h2>
                <p style="margin-bottom: 15px; font-size: 14px;">Enter your Cloudinary credentials to enable image uploads:</p>
                <div class="setup-input">
                    <label>Cloud Name:</label>
                    <input type="text" id="cloudName" placeholder="e.g., dxyz123abc">
                </div>
                <div class="setup-input">
                    <label>Upload Preset:</label>
                    <input type="text" id="uploadPreset" placeholder="e.g., blue_scholars_preset">
                </div>
                <button onclick="saveCloudinaryConfig()">SAVE CONFIGURATION</button>
                <p style="margin-top: 15px; font-size: 12px; opacity: 0.7;">
                    Don't have these? <a href="https://cloudinary.com/users/register_free" target="_blank" style="color: #fff;">Sign up for free</a>
                </p>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <h3>TOTAL PRODUCTS</h3>
                    <p id="totalProducts">0</p>
                </div>
                <div class="stat-card">
                    <h3>IN STOCK</h3>
                    <p id="inStock">0</p>
                </div>
                <div class="stat-card">
                    <h3>LOW STOCK</h3>
                    <p id="lowStock">0</p>
                </div>
            </div>

            <button class="btn-add" onclick="openModal()">+ ADD NEW PRODUCT</button>

            <div id="productsContainer" class="loading">Loading inventory...</div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">ADD PRODUCT</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="productForm">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="productCategory" required>
                        <option value="vinyl">Vinyl</option>
                        <option value="cd">CDs</option>
                        <option value="apparel">Apparel</option>
                        <option value="merch">Merch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (USD) *</label>
                    <input type="number" id="productPrice" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" id="productQuantity" min="0" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="image-upload-section">
                        <button type="button" class="upload-btn" onclick="openCloudinaryWidget()">
                            📤 UPLOAD IMAGE
                        </button>
                        <input type="url" id="productImage" placeholder="Or paste image URL manually">
                        <img id="imagePreview" class="image-preview" style="display: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>SKU / Product ID *</label>
                    <input type="text" id="productSku" required>
                </div>
                <button type="submit">SAVE PRODUCT</button>
                <div id="formError" class="error"></div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'bluescholars2026'; // CHANGE THIS!
        let currentEditId = null;
        let cloudinaryConfig = null;

        // Load Cloudinary config
        function loadCloudinaryConfig() {
            const saved = localStorage.getItem('cloudinaryConfig');
            if (saved) {
                cloudinaryConfig = JSON.parse(saved);
                document.getElementById('cloudinarySetup').classList.add('hidden');
                return true;
            }
            return false;
        }

        function saveCloudinaryConfig() {
            const cloudName = document.getElementById('cloudName').value.trim();
            const uploadPreset = document.getElementById('uploadPreset').value.trim();
            
            if (!cloudName || !uploadPreset) {
                alert('Please enter both Cloud Name and Upload Preset');
                return;
            }
            
            cloudinaryConfig = { cloudName, uploadPreset };
            localStorage.setItem('cloudinaryConfig', JSON.stringify(cloudinaryConfig));
            document.getElementById('cloudinarySetup').classList.add('hidden');
            alert('Cloudinary configured successfully!');
        }

        function openCloudinaryWidget() {
            if (!cloudinaryConfig) {
                alert('Please configure Cloudinary first');
                document.getElementById('cloudinarySetup').classList.remove('hidden');
                return;
            }

            const widget = cloudinary.createUploadWidget({
                cloudName: cloudinaryConfig.cloudName,
                uploadPreset: cloudinaryConfig.uploadPreset,
                sources: ['local', 'url', 'camera'],
                multiple: false,
                folder: 'blue-scholars',
                clientAllowedFormats: ['png', 'jpg', 'jpeg', 'webp', 'gif'],
                maxImageFileSize: 5000000, // 5MB
                maxImageWidth: 2000,
                maxImageHeight: 2000,
                cropping: false,
                styles: {
                    palette: {
                        window: "#000000",
                        windowBorder: "#FFFFFF",
                        tabIcon: "#FFFFFF",
                        menuIcons: "#FFFFFF",
                        textDark: "#FFFFFF",
                        textLight: "#000000",
                        link: "#FFFFFF",
                        action: "#FFFFFF",
                        inactiveTabIcon: "#555555",
                        error: "#ff6b6b",
                        inProgress: "#FFFFFF",
                        complete: "#4CAF50",
                        sourceBg: "#000000"
                    },
                    fonts: {
                        default: null,
                        "'Courier New', monospace": {
                            url: null,
                            active: true
                        }
                    }
                }
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const imageUrl = result.info.secure_url;
                    document.getElementById('productImage').value = imageUrl;
                    
                    // Show preview
                    const preview = document.getElementById('imagePreview');
                    preview.src = imageUrl;
                    preview.style.display = 'block';
                }
            });

            widget.open();
        }

        // Update image preview when URL is manually entered
        document.getElementById('productImage').addEventListener('input', (e) => {
            const url = e.target.value;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        });

        // Login handling
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuth', 'true');
                showAdminPanel();
            } else {
                document.getElementById('loginError').textContent = 'Invalid password';
            }
        });

        function logout() {
            sessionStorage.removeItem('adminAuth');
            location.reload();
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadCloudinaryConfig();
            loadProducts();
        }

        // Check if already logged in
        if (sessionStorage.getItem('adminAuth') === 'true') {
            showAdminPanel();
        }

        // Load products from storage
        async function loadProducts() {
            try {
                const result = await window.storage.list('product:', false);
                
                if (!result || !result.keys || result.keys.length === 0) {
                    document.getElementById('productsContainer').innerHTML = 
                        '<p style="text-align: center; padding: 40px;">No products yet. Add your first product!</p>';
                    updateStats([]);
                    return;
                }

                const products = [];
                for (const key of result.keys) {
                    try {
                        const data = await window.storage.get(key, false);
                        if (data && data.value) {
                            const product = JSON.parse(data.value);
                            product.id = key.replace('product:', '');
                            products.push(product);
                        }
                    } catch (err) {
                        console.error('Error loading product:', key, err);
                    }
                }

                displayProducts(products);
                updateStats(products);
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = 
                    '<p style="text-align: center; padding: 40px; color: #ff6b6b;">Error loading products. Please refresh.</p>';
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (products.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px;">No products yet. Add your first product!</p>';
                return;
            }

            container.className = 'products-grid';
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <h3>${p.name}</h3>
                    <p>Category: ${p.category}</p>
                    <p>Price: $${parseFloat(p.price).toFixed(2)}</p>
                    <p>Quantity: ${p.quantity}</p>
                    <p>SKU: ${p.sku}</p>
                    ${p.description ? `<p style="margin-top: 10px; opacity: 0.7; font-size: 12px;">${p.description}</p>` : ''}
                    <div class="product-actions">
                        <button onclick="editProduct('${p.id}')">EDIT</button>
                        <button onclick="deleteProduct('${p.id}', '${p.name}')">DELETE</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(products) {
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('inStock').textContent = products.filter(p => p.quantity > 0).length;
            document.getElementById('lowStock').textContent = products.filter(p => p.quantity > 0 && p.quantity <= 5).length;
        }

        // Modal handling
        function openModal(productId = null) {
            currentEditId = productId;
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            
            if (productId) {
                document.getElementById('modalTitle').textContent = 'EDIT PRODUCT';
                loadProductForEdit(productId);
            } else {
                document.getElementById('modalTitle').textContent = 'ADD PRODUCT';
                form.reset();
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            document.getElementById('productForm').reset();
            document.getElementById('formError').textContent = '';
            document.getElementById('imagePreview').style.display = 'none';
            currentEditId = null;
        }

        async function loadProductForEdit(productId) {
            try {
                const data = await window.storage.get(`product:${productId}`, false);
                if (data && data.value) {
                    const product = JSON.parse(data.value);
                    document.getElementById('productName').value = product.name;
                    document.getElementById('productCategory').value = product.category;
                    document.getElementById('productPrice').value = product.price;
                    document.getElementById('productQuantity').value = product.quantity;
                    document.getElementById('productDescription').value = product.description || '';
                    document.getElementById('productImage').value = product.image || '';
                    document.getElementById('productSku').value = product.sku;
                    
                    // Show image preview if exists
                    if (product.image) {
                        const preview = document.getElementById('imagePreview');
                        preview.src = product.image;
                        preview.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading product for edit:', error);
            }
        }

        function editProduct(productId) {
            openModal(productId);
        }

        async function deleteProduct(productId, productName) {
            if (!confirm(`Delete "${productName}"? This cannot be undone.`)) return;
            
            try {
                await window.storage.delete(`product:${productId}`, false);
                await loadProducts();
            } catch (error) {
                alert('Error deleting product: ' + error.message);
            }
        }

        // Form submission
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const product = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseInt(document.getElementById('productQuantity').value),
                description: document.getElementById('productDescription').value,
                image: document.getElementById('productImage').value,
                sku: document.getElementById('productSku').value,
                updatedAt: new Date().toISOString()
            };

            try {
                const productId = currentEditId || product.sku.toLowerCase().replace(/[^a-z0-9]/g, '-');
                await window.storage.set(`product:${productId}`, JSON.stringify(product), false);
                
                closeModal();
                await loadProducts();
            } catch (error) {
                document.getElementById('formError').textContent = 'Error saving product: ' + error.message;
            }
        });
    </script>
</body>
</html>
